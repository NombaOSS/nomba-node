name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Static checks and coverage run once, on the Node version the dev tools target.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:coverage

  # Build and pack once, with the dev tools' Node version.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/
          retention-days: 1

  # The SDK supports every Node version from 18, but the dev tools (vitest,
  # tsup) need Node 22+. So the vitest suite runs on 22 and 24, and every
  # version installs the packed tarball into an empty app and runs the
  # dependency-free smoke test against it.
  test:
    name: test (${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.node-version >= 22
        run: npm ci --ignore-scripts
      - if: matrix.node-version >= 22
        run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Smoke test the packed package (import and require)
        run: |
          mkdir "$RUNNER_TEMP/app"
          cp scripts/smoke.mjs scripts/smoke.cjs test/fixtures/webhook-fixture.json "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/package/nombaoss-nomba-node-*.tgz
          node smoke.mjs
          node smoke.cjs
